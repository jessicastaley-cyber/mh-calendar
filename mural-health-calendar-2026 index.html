<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural Health | 6-Month Calendar 2026</title>
<style>
  :root {
    --tangerine: #F97A24;
    --oceanic:   #21A9CB;
    --violet:    #C01082;
    --ops:       #4B7BB5;
    --holiday:   #C94040;
    --bg:        #F8F6F3;
    --surface:   #F0EDE8;
    --border:    #E2DDD7;
    --text:      #1A1A1A;
    --text-muted:#8A8480;
    --white:     #FEFEFE;
    --today-bg:  #FFF4EB;
    --qtr-bg:    #ECEAE6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--text);
    padding: 0 28px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-mark {
    width: 34px; height: 34px;
    background: var(--tangerine);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: #FEFEFE; letter-spacing: -0.5px;
  }

  .logo-text    { font-size: 17px; font-weight: 700; color: #FEFEFE; letter-spacing: -0.2px; }
  .logo-sub     { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 1px; }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .header-hint  { font-size: 12px; color: rgba(255,255,255,0.4); margin-right: 6px; }

  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: all 0.15s; font-family: inherit;
  }
  .btn-primary  { background: var(--tangerine); color: #FEFEFE; }
  .btn-primary:hover { background: #e56c1a; transform: translateY(-1px); }
  .btn-ghost {
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.14); color: #FEFEFE; }

  /* ── Subheader / Legend ── */
  .subheader {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 10px 28px;
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
  }

  .legend-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text-muted); margin-right: 6px;
  }

  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--text-muted);
    background: var(--surface); padding: 4px 10px;
    border-radius: 20px; border: 1px solid var(--border);
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .legend-item.qtr-legend {
    background: var(--qtr-bg);
    border-style: dashed;
  }

  .event-count-badge {
    margin-left: auto; font-size: 12px; color: var(--text-muted);
    background: var(--surface); padding: 4px 12px;
    border-radius: 20px; border: 1px solid var(--border);
  }

  /* ── Calendar ── */
  .calendar-wrapper { padding: 20px 28px 40px; max-width: 1700px; margin: 0 auto; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  /* ── Month card ── */
  .month-card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }

  .month-header {
    padding: 13px 16px;
    background: var(--text);
    color: #FEFEFE;
    display: flex; align-items: baseline; gap: 8px;
  }

  .month-name  { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .month-year  { font-size: 13px; color: rgba(255,255,255,0.45); font-weight: 400; }
  .month-count { margin-left: auto; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); }

  .dow-row {
    display: grid; grid-template-columns: repeat(7, 1fr);
    background: var(--surface); border-bottom: 1px solid var(--border);
  }

  .dow-cell {
    text-align: center; font-size: 10px; font-weight: 700;
    color: var(--text-muted); padding: 7px 2px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ── Day cells ── */
  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

  .day-cell {
    min-height: 90px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 5px 4px 4px;
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }

  .day-cell:nth-child(7n) { border-right: none; }
  .day-cell:hover { background: var(--bg); }

  .day-cell.empty {
    background: var(--surface);
    opacity: 0.6;
    cursor: default;
    pointer-events: none;
  }

  .day-cell.today { background: var(--today-bg); }

  /* Quarter start/end shading */
  .day-cell.qtr-day { background: var(--qtr-bg); }
  .day-cell.qtr-day:hover { background: #E4E1DC; }

  .qtr-label {
    font-size: 8.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9A948E;
    line-height: 1;
    margin-bottom: 2px;
    display: block;
    border: 1px dashed #C8C2BB;
    border-radius: 3px;
    padding: 1px 4px;
    width: fit-content;
  }

  .day-cell.drag-over {
    background: #E6F6FD;
    outline: 2px dashed var(--oceanic);
    outline-offset: -2px;
  }

  .day-num-wrap { display: flex; align-items: center; margin-bottom: 3px; }

  .day-num {
    font-size: 12px; font-weight: 600; color: var(--text);
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; line-height: 1;
  }

  .day-cell.today .day-num {
    background: var(--tangerine); color: #FEFEFE; font-weight: 700;
  }

  .day-cell.empty .day-num { color: var(--text-muted); }

  /* ── Event chips ── */
  .event-chip {
    font-size: 10.5px; font-weight: 600;
    padding: 2px 6px; border-radius: 4px; margin-bottom: 2px;
    cursor: grab;
    white-space: normal; word-break: break-word; overflow: hidden;
    width: 100%;
    display: flex; align-items: flex-start; gap: 4px;
    color: #FEFEFE;
    user-select: none;
    transition: opacity 0.1s, transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }

  .event-chip:hover { opacity: 0.88; box-shadow: 0 2px 6px rgba(0,0,0,0.18); transform: translateY(-1px); }
  .event-chip.dragging { opacity: 0.35; transform: scale(0.96); }

  /* Multi-day continuation styling */
  .event-chip.chip-cont-start { border-radius: 4px 4px 4px 4px; }
  .event-chip.chip-cont-mid   { border-radius: 2px; opacity: 0.82; }
  .event-chip.chip-cont-end   { border-radius: 2px; opacity: 0.82; }

  .chip-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    flex-shrink: 0; margin-top: 3px;
  }

  .chip-arrow {
    font-size: 9px; opacity: 0.7; flex-shrink: 0; margin-top: 1px; line-height: 1.5;
  }

  .chip-text {
    overflow: hidden;
    white-space: normal; word-break: break-word; line-height: 1.3;
  }

  .color-tangerine { background: var(--tangerine); }
  .color-oceanic   { background: var(--oceanic); }
  .color-violet    { background: var(--violet); }
  .color-ops       { background: var(--ops); }
  .color-holiday   { background: var(--holiday); }

  .more-label {
    font-size: 10px; color: var(--text-muted); font-weight: 600;
    padding: 1px 4px; cursor: pointer; border-radius: 3px;
  }
  .more-label:hover { background: var(--surface); color: var(--text); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.55);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s;
    backdrop-filter: blur(2px);
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--white); border-radius: 16px;
    padding: 28px 28px 24px;
    width: 460px; max-width: 94vw;
    transform: translateY(10px) scale(0.98);
    transition: transform 0.2s ease;
    box-shadow: 0 24px 64px rgba(0,0,0,0.22);
  }

  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-title  { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .modal-date   { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .divider      { height: 1px; background: var(--border); margin: 16px 0; }

  .form-group   { margin-bottom: 16px; }

  .form-label {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.07em;
    display: block; margin-bottom: 7px;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .form-input {
    width: 100%; padding: 10px 13px;
    border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 14px; outline: none;
    font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s;
    color: var(--text); background: var(--white);
  }
  .form-input:focus { border-color: var(--oceanic); box-shadow: 0 0 0 3px rgba(33,169,203,0.12); }
  .form-input.error { border-color: #D04040; box-shadow: 0 0 0 3px rgba(208,64,64,0.1); }

  .multiday-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-muted);
    cursor: pointer; margin-bottom: 4px;
    user-select: none;
  }

  .multiday-toggle input[type=checkbox] {
    width: 16px; height: 16px; cursor: pointer;
    accent-color: var(--oceanic);
  }

  .enddate-group { margin-top: 10px; }

  .color-picker  { display: flex; gap: 12px; align-items: center; }

  .color-option {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .color-option:hover { transform: scale(1.12); }
  .color-option.selected {
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--white), 0 0 0 4px var(--text);
  }

  .color-option.opt-tangerine { background: var(--tangerine); }
  .color-option.opt-oceanic   { background: var(--oceanic); }
  .color-option.opt-violet    { background: var(--violet); }
  .color-option.opt-ops       { background: var(--ops); }
  .color-option.opt-holiday   { background: var(--holiday); }

  .color-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }

  .modal-actions { display: flex; gap: 8px; margin-top: 22px; align-items: center; }

  .btn-delete {
    background: #FEF0F0; color: #C03030;
    border: 1.5px solid #FCCACA;
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .btn-delete:hover { background: #FFD8D8; border-color: #D04040; }

  .btn-cancel { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
  .btn-cancel:hover { background: var(--border); }
  .btn-save { background: var(--tangerine); color: #FEFEFE; margin-left: auto; }
  .btn-save:hover { background: #e56c1a; }

  /* ── Day detail modal ── */
  .day-event-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 320px; overflow-y: auto;
  }

  .day-event-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; transition: background 0.1s;
  }
  .day-event-row:hover { background: var(--surface); }

  .day-event-color { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .day-event-title { font-size: 13px; font-weight: 600; }
  .day-event-notes { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .day-event-range { font-size: 11px; color: var(--oceanic); margin-top: 2px; font-weight: 500; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--text); color: #FEFEFE;
    padding: 11px 22px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    z-index: 1000; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 1100px) { .calendar-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 700px)  { .calendar-grid { grid-template-columns: 1fr; } .header-hint { display:none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">M</div>
    <div>
      <div class="logo-text">Mural Health</div>
      <div class="logo-sub">6-Month Planner · July – December 2026</div>
    </div>
  </div>
  <div class="header-right">
    <span class="header-hint">Click a day to add · Drag to move</span>
    <button class="btn btn-primary" onclick="openGlobalAdd()">+ Add Event</button>
    <button class="btn btn-ghost" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-ghost" onclick="refreshCalendar()" id="btnRefresh" title="Reload latest events">↻ Refresh</button>
  </div>
</header>

<div class="subheader">
  <span class="legend-label">Categories</span>
  <div class="legend-item"><div class="legend-dot" style="background:var(--tangerine)"></div>Marketing</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--oceanic)"></div>Product</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--violet)"></div>Events</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--ops)"></div>Ops</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--holiday)"></div>Holiday</div>
  <div class="legend-item qtr-legend"><div class="legend-dot" style="background:var(--qtr-bg);border:1px dashed #C8C2BB"></div>Quarter boundary</div>
  <span class="event-count-badge" id="totalCount">0 events</span>
</div>

<div class="calendar-wrapper">
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- ── Event Modal ── -->
<div class="modal-overlay" id="eventModal" onclick="onOverlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add Event</div>
    <div class="modal-date" id="modalDate"></div>
    <div class="divider"></div>

    <!-- Date row (global add only) -->
    <div class="form-group" id="datePickerGroup" style="display:none">
      <label class="form-label">Start date</label>
      <input class="form-input" id="inputStartDate" type="date" min="2026-07-01" max="2026-12-31">
    </div>

    <!-- Title -->
    <div class="form-group">
      <label class="form-label" for="inputTitle">Event title</label>
      <input class="form-input" id="inputTitle" type="text" placeholder="e.g. Product launch, Conference…" maxlength="60">
    </div>

    <!-- Multi-day toggle -->
    <div class="form-group" style="margin-bottom:8px">
      <label class="multiday-toggle">
        <input type="checkbox" id="multiDayCheck" onchange="toggleEndDate()">
        Multi-day event
      </label>
      <div class="enddate-group" id="endDateGroup" style="display:none">
        <label class="form-label" style="margin-top:8px">End date</label>
        <input class="form-input" id="inputEndDate" type="date" min="2026-07-01" max="2026-12-31">
      </div>
    </div>

    <!-- Notes -->
    <div class="form-group">
      <label class="form-label" for="inputNotes">Notes (optional)</label>
      <input class="form-input" id="inputNotes" type="text" placeholder="Owner, details, link…" maxlength="120">
    </div>

    <!-- Category -->
    <div class="form-group">
      <label class="form-label">Category</label>
      <div class="color-picker">
        <div class="color-option opt-tangerine selected" data-c="tangerine" onclick="pickColor('tangerine')" title="Marketing"></div>
        <div class="color-option opt-oceanic"   data-c="oceanic"   onclick="pickColor('oceanic')"   title="Product"></div>
        <div class="color-option opt-violet"    data-c="violet"    onclick="pickColor('violet')"    title="Events"></div>
        <div class="color-option opt-ops"       data-c="ops"       onclick="pickColor('ops')"       title="Ops"></div>
        <div class="color-option opt-holiday"   data-c="holiday"   onclick="pickColor('holiday')"   title="Holiday"></div>
        <span class="color-label" id="colorLabel">Marketing</span>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-delete" id="btnDelete" onclick="deleteEvent()" style="display:none">Delete</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" onclick="saveEvent()">Save event</button>
    </div>
  </div>
</div>

<!-- ── Day Detail Modal ── -->
<div class="modal-overlay" id="dayModal" onclick="onDayOverlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="dayModalTitle">Events</div>
    <div class="modal-date"  id="dayModalDate"></div>
    <div class="divider"></div>
    <div class="day-event-list" id="dayEventList"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn btn-primary" onclick="openAddFromDay()">+ Add to this day</button>
      <button class="btn btn-cancel" onclick="closeDayModal()" style="margin-left:auto">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Supabase ───────────────────────────────────────────────────────────────
const { createClient } = supabase;
const sb = createClient(
  'https://qhggnmungopjwdwetmbs.supabase.co',
  'sb_publishable_FoU7Yg6ZS3ZIabgsWbz1wQ_qb3KhYZV'
);

async function dbSave(startKey, ev) {
  const { error } = await sb.from('events').upsert({
    id: ev.id, start_date: startKey, end_date: ev.endDate || null,
    title: ev.title, notes: ev.notes || null, color: ev.color
  });
  if (error) { console.error('dbSave error:', error); toast('⚠ Sync error — changes may not be saved'); }
}

async function dbDelete(id) {
  const { error } = await sb.from('events').delete().eq('id', id);
  if (error) { console.error('dbDelete error:', error); toast('⚠ Sync error — delete may not have saved'); }
}

// ── Constants ──────────────────────────────────────────────────────────────
const MONTHS = [
  {m:6,  y:2026, name:'July'},
  {m:7,  y:2026, name:'August'},
  {m:8,  y:2026, name:'September'},
  {m:9,  y:2026, name:'October'},
  {m:10, y:2026, name:'November'},
  {m:11, y:2026, name:'December'},
];

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const COLOR_LABELS = {
  tangerine: 'Marketing', oceanic: 'Product', violet: 'Events',
  ops: 'Ops', holiday: 'Holiday'
};

// Quarter boundary dates and their labels
const QUARTER_DATES = {
  '2026-07-01': 'Q3 Start',
  '2026-09-30': 'Q3 End',
  '2026-10-01': 'Q4 Start',
  '2026-12-31': 'Q4 End',
};

const today    = new Date();
const TODAY_KEY = fmtKey(today.getFullYear(), today.getMonth(), today.getDate());

// ── State ──────────────────────────────────────────────────────────────────
let events    = {};   // { 'startDate': [{id, title, notes, color, endDate?}] }
let modalDate = null; // start date key for current modal
let editId    = null;
let selColor  = 'tangerine';
let drag      = null; // { id, startKey }
let dayViewKey = null;

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function fmtDisplay(key) {
  return new Date(key + 'T12:00:00')
    .toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}

function fmtShort(key) {
  return new Date(key + 'T12:00:00')
    .toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Returns all events visible on a given dateKey (including multi-day spans)
// Each returned item: { ev, startKey, position: 'single'|'start'|'mid'|'end' }
function getEventsForDay(dateKey) {
  const result = [];
  Object.keys(events).forEach(startKey => {
    (events[startKey] || []).forEach(ev => {
      if (ev.endDate && ev.endDate > startKey) {
        // Multi-day event
        if (dateKey >= startKey && dateKey <= ev.endDate) {
          let position = 'mid';
          if (dateKey === startKey)    position = 'start';
          else if (dateKey === ev.endDate) position = 'end';
          result.push({ ev, startKey, position });
        }
      } else {
        // Single-day
        if (dateKey === startKey) result.push({ ev, startKey, position: 'single' });
      }
    });
  });
  return result;
}

function totalEvents() {
  // Count unique events (not per-day occurrences)
  return Object.values(events).reduce((s,arr) => s + arr.length, 0);
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  MONTHS.forEach(({m, y, name}) => grid.appendChild(buildMonth(m, y, name)));
  const t = totalEvents();
  document.getElementById('totalCount').textContent = `${t} event${t!==1?'s':''}`;
}

function buildMonth(month, year, name) {
  const card = document.createElement('div');
  card.className = 'month-card';

  // Count events starting in this month
  const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
  const mCount = Object.keys(events).filter(k => k.startsWith(prefix))
                   .reduce((s,k) => s + events[k].length, 0);

  const hdr = document.createElement('div');
  hdr.className = 'month-header';
  hdr.innerHTML = `<span class="month-name">${name}</span>
                   <span class="month-year">${year}</span>
                   <span class="month-count">${mCount ? mCount + ' event'+(mCount!==1?'s':'') : ''}</span>`;
  card.appendChild(hdr);

  const dow = document.createElement('div');
  dow.className = 'dow-row';
  DOW.forEach(d => { const c = document.createElement('div'); c.className = 'dow-cell'; c.textContent = d; dow.appendChild(c); });
  card.appendChild(dow);

  const grid = document.createElement('div');
  grid.className = 'days-grid';

  const firstDow  = new Date(year, month, 1).getDay();
  const daysInMon = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDow; i++) {
    const c = document.createElement('div'); c.className = 'day-cell empty'; grid.appendChild(c);
  }

  for (let d = 1; d <= daysInMon; d++) {
    const key  = fmtKey(year, month, d);
    const cell = document.createElement('div');

    const qtrLabel = QUARTER_DATES[key];
    cell.className = 'day-cell' +
      (key === TODAY_KEY ? ' today' : '') +
      (qtrLabel ? ' qtr-day' : '');
    cell.dataset.date = key;

    // Day number row
    const wrap = document.createElement('div');
    wrap.className = 'day-num-wrap';
    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    wrap.appendChild(num);
    cell.appendChild(wrap);

    // Quarter label (if applicable)
    if (qtrLabel) {
      const ql = document.createElement('span');
      ql.className = 'qtr-label';
      ql.textContent = qtrLabel;
      cell.appendChild(ql);
    }

    // Events visible on this day
    const dayEvts = getEventsForDay(key);
    const MAX = 3;
    dayEvts.slice(0, MAX).forEach(item => cell.appendChild(buildChip(item, key)));
    if (dayEvts.length > MAX) {
      const more = document.createElement('div');
      more.className = 'more-label';
      more.textContent = `+${dayEvts.length - MAX} more`;
      more.onclick = e => { e.stopPropagation(); openDayView(key); };
      cell.appendChild(more);
    }

    cell.addEventListener('click', () => openAdd(key));

    cell.addEventListener('dragover',  e => { e.preventDefault(); cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', e => {
      e.preventDefault();
      cell.classList.remove('drag-over');
      if (drag) {
        const ev = (events[drag.startKey] || []).find(e => e.id === drag.id);
        if (ev && drag.startKey !== key) {
          // Shift the event (and its endDate if multi-day) to new start
          shiftEvent(drag.id, drag.startKey, key);
        }
        drag = null;
      }
    });

    grid.appendChild(cell);
  }

  card.appendChild(grid);
  return card;
}

function buildChip({ev, startKey, position}, currentKey) {
  const chip = document.createElement('div');
  const contClass = position === 'single' ? '' :
                    position === 'start'  ? ' chip-cont-start' :
                    position === 'end'    ? ' chip-cont-end'   : ' chip-cont-mid';
  chip.className = `event-chip color-${ev.color}${contClass}`;
  chip.title = [ev.title, ev.endDate ? `${fmtShort(startKey)} – ${fmtShort(ev.endDate)}` : '', ev.notes].filter(Boolean).join('\n');
  chip.draggable = true;

  // Icon
  const icon = document.createElement(position === 'single' || position === 'start' ? 'span' : 'span');
  if (position === 'single' || position === 'start') {
    icon.className = 'chip-dot';
  } else {
    icon.className = 'chip-arrow';
    icon.textContent = '→';
  }
  chip.appendChild(icon);

  const txt = document.createElement('span');
  txt.className = 'chip-text';
  // Show title on start/single; show shortened version on continuations
  txt.textContent = (position === 'mid' || position === 'end')
    ? ev.title
    : ev.title;
  chip.appendChild(txt);

  chip.addEventListener('click', e => { e.stopPropagation(); openEdit(startKey, ev.id); });
  chip.addEventListener('dragstart', e => {
    drag = { id: ev.id, startKey };
    chip.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  chip.addEventListener('dragend', () => chip.classList.remove('dragging'));

  return chip;
}

// ── Event movement ─────────────────────────────────────────────────────────
function shiftEvent(id, fromKey, toKey) {
  const list = events[fromKey] || [];
  const idx  = list.findIndex(e => e.id === id);
  if (idx === -1) return;
  const [ev] = list.splice(idx, 1);
  if (!list.length) delete events[fromKey]; else events[fromKey] = list;

  // If multi-day, shift endDate by same offset
  if (ev.endDate) {
    const diff = new Date(toKey + 'T12:00:00') - new Date(fromKey + 'T12:00:00');
    const newEnd = new Date(new Date(ev.endDate + 'T12:00:00').getTime() + diff);
    ev.endDate = fmtKey(newEnd.getFullYear(), newEnd.getMonth(), newEnd.getDate());
  }

  if (!events[toKey]) events[toKey] = [];
  events[toKey].push(ev);
  render();
  toast('Event moved');
  dbSave(toKey, ev);
}

// ── Modals ────────────────────────────────────────────────────────────────
function openGlobalAdd() {
  modalDate = null; editId = null;
  document.getElementById('modalTitle').textContent = 'Add Event';
  document.getElementById('modalDate').textContent  = 'Choose a date below';
  document.getElementById('datePickerGroup').style.display = '';
  document.getElementById('inputStartDate').value = '';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputNotes').value = '';
  document.getElementById('btnDelete').style.display = 'none';
  resetMultiDay();
  pickColor('tangerine');
  openModal('eventModal');
  setTimeout(() => document.getElementById('inputStartDate').focus(), 120);
}

function openAdd(key) {
  modalDate = key; editId = null;
  document.getElementById('modalTitle').textContent = 'Add Event';
  document.getElementById('modalDate').textContent  = fmtDisplay(key);
  document.getElementById('datePickerGroup').style.display = 'none';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputNotes').value = '';
  document.getElementById('btnDelete').style.display = 'none';
  resetMultiDay();
  pickColor('tangerine');
  openModal('eventModal');
  setTimeout(() => document.getElementById('inputTitle').focus(), 120);
}

function openEdit(key, id) {
  const ev = (events[key] || []).find(e => e.id === id);
  if (!ev) return;
  modalDate = key; editId = id;
  document.getElementById('modalTitle').textContent = 'Edit Event';
  document.getElementById('modalDate').textContent  = fmtDisplay(key);
  document.getElementById('datePickerGroup').style.display = 'none';
  document.getElementById('inputTitle').value = ev.title;
  document.getElementById('inputNotes').value = ev.notes || '';
  document.getElementById('btnDelete').style.display = '';
  pickColor(ev.color);

  // Multi-day
  if (ev.endDate) {
    document.getElementById('multiDayCheck').checked = true;
    document.getElementById('endDateGroup').style.display = '';
    document.getElementById('inputEndDate').value = ev.endDate;
    document.getElementById('inputEndDate').min = key;
  } else {
    resetMultiDay();
  }

  openModal('eventModal');
  setTimeout(() => document.getElementById('inputTitle').focus(), 120);
}

function resetMultiDay() {
  document.getElementById('multiDayCheck').checked = false;
  document.getElementById('endDateGroup').style.display = 'none';
  document.getElementById('inputEndDate').value = '';
}

function toggleEndDate() {
  const on = document.getElementById('multiDayCheck').checked;
  const grp = document.getElementById('endDateGroup');
  grp.style.display = on ? '' : 'none';
  if (on) {
    const startKey = modalDate || document.getElementById('inputStartDate').value;
    if (startKey) {
      document.getElementById('inputEndDate').min = startKey;
      document.getElementById('inputEndDate').value = startKey;
    }
    document.getElementById('inputEndDate').focus();
  }
}

function saveEvent() {
  let startKey = modalDate;
  if (!startKey) {
    const v = document.getElementById('inputStartDate').value;
    if (!v) { shake('inputStartDate'); return; }
    startKey = v;
  }

  const title = document.getElementById('inputTitle').value.trim();
  if (!title) { shake('inputTitle'); return; }

  const notes = document.getElementById('inputNotes').value.trim();

  let endDate = null;
  if (document.getElementById('multiDayCheck').checked) {
    endDate = document.getElementById('inputEndDate').value || null;
    if (endDate && endDate < startKey) { shake('inputEndDate'); return; }
  }

  const evObj = { title, notes, color: selColor };
  if (endDate && endDate !== startKey) evObj.endDate = endDate;

  let savedEv;
  if (editId) {
    const list = events[startKey] || [];
    const idx  = list.findIndex(e => e.id === editId);
    if (idx !== -1) { list[idx] = { ...list[idx], ...evObj }; savedEv = list[idx]; }
    toast('Event updated');
  } else {
    if (!events[startKey]) events[startKey] = [];
    savedEv = { id: uid(), ...evObj };
    events[startKey].push(savedEv);
    toast('Event added');
  }

  closeModal();
  render();
  if (savedEv) dbSave(startKey, savedEv);
}

function deleteEvent() {
  if (!modalDate || !editId) return;
  const idToDelete = editId;
  const list = events[modalDate] || [];
  const idx  = list.findIndex(e => e.id === editId);
  if (idx !== -1) { list.splice(idx, 1); if (!list.length) delete events[modalDate]; else events[modalDate] = list; }
  closeModal();
  render();
  toast('Event deleted');
  dbDelete(idToDelete);
}

// ── Day view modal ─────────────────────────────────────────────────────────
function openDayView(key) {
  dayViewKey = key;
  document.getElementById('dayModalTitle').textContent = fmtDisplay(key).split(',')[0];
  document.getElementById('dayModalDate').textContent  = fmtDisplay(key);
  renderDayList(key);
  openModal('dayModal');
}

function renderDayList(key) {
  const list = document.getElementById('dayEventList');
  list.innerHTML = '';
  const items = getEventsForDay(key);
  if (!items.length) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:8px 0">No events on this day.</p>';
    return;
  }
  items.forEach(({ev, startKey, position}) => {
    const row = document.createElement('div');
    row.className = 'day-event-row';
    const isMulti = ev.endDate && ev.endDate !== startKey;
    row.innerHTML = `
      <div class="day-event-color" style="background:var(--${ev.color})"></div>
      <div>
        <div class="day-event-title">${escHtml(ev.title)}</div>
        ${isMulti ? `<div class="day-event-range">${fmtShort(startKey)} – ${fmtShort(ev.endDate)}</div>` : ''}
        ${ev.notes ? `<div class="day-event-notes">${escHtml(ev.notes)}</div>` : ''}
      </div>
    `;
    row.onclick = () => { closeDayModal(); openEdit(startKey, ev.id); };
    list.appendChild(row);
  });
}

function openAddFromDay() {
  closeDayModal();
  if (dayViewKey) openAdd(dayViewKey);
}

function closeDayModal() { document.getElementById('dayModal').classList.remove('open'); dayViewKey = null; }
function onDayOverlayClick(e) { if (e.target === document.getElementById('dayModal')) closeDayModal(); }

// ── Modal helpers ──────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal()  { document.getElementById('eventModal').classList.remove('open'); }
function onOverlayClick(e) { if (e.target === document.getElementById('eventModal')) closeModal(); }

function pickColor(c) {
  selColor = c;
  document.querySelectorAll('.color-option').forEach(el => el.classList.toggle('selected', el.dataset.c === c));
  document.getElementById('colorLabel').textContent = COLOR_LABELS[c] || c;
}

function shake(inputId) {
  const el = document.getElementById(inputId);
  el.classList.add('error');
  el.focus();
  setTimeout(() => el.classList.remove('error'), 1800);
}

// ── Keyboard ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeDayModal(); }
  if (e.key === 'Enter' && !e.shiftKey && document.getElementById('eventModal').classList.contains('open')) saveEvent();
});

// ── Export ─────────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = [['Start Date', 'End Date', 'Title', 'Category', 'Notes']];
  Object.keys(events).sort().forEach(key => {
    (events[key] || []).forEach(ev => {
      rows.push([key, ev.endDate || key, ev.title, COLOR_LABELS[ev.color] || ev.color, ev.notes || '']);
    });
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = Object.assign(document.createElement('a'), {
    href: 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv),
    download: 'mural-health-calendar-jul-dec-2026.csv'
  });
  a.click();
  toast('Exported to CSV');
}

// ── Persistence (Supabase) ─────────────────────────────────────────────────
async function load() {
  try {
    const { data, error } = await sb.from('events').select('*');
    if (error) throw error;
    events = {};
    (data || []).forEach(row => {
      if (!events[row.start_date]) events[row.start_date] = [];
      events[row.start_date].push({
        id: row.id, title: row.title, notes: row.notes || '', color: row.color,
        ...(row.end_date ? { endDate: row.end_date } : {})
      });
    });
  } catch(e) { console.error('Load error:', e); toast('Could not load events — check connection'); }
}

async function refreshCalendar() {
  const btn = document.getElementById('btnRefresh');
  btn.textContent = '↻ Syncing…';
  btn.disabled = true;
  await load();
  render();
  btn.textContent = '↻ Refresh';
  btn.disabled = false;
  toast('Calendar refreshed');
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  // One-time migration: move any localStorage events into Supabase
  const localData = localStorage.getItem('mh_cal_2026');
  if (localData) {
    try {
      const localEvents = JSON.parse(localData);
      const rows = [];
      Object.keys(localEvents).forEach(startDate => {
        (localEvents[startDate] || []).forEach(ev => {
          rows.push({
            id: ev.id, start_date: startDate, end_date: ev.endDate || null,
            title: ev.title, notes: ev.notes || null, color: ev.color
          });
        });
      });
      if (rows.length > 0) {
        const { error } = await sb.from('events').upsert(rows);
        if (!error) {
          localStorage.removeItem('mh_cal_2026');
          toast(`Restored ${rows.length} event${rows.length !== 1 ? 's' : ''} from local storage`);
        }
      } else {
        localStorage.removeItem('mh_cal_2026');
      }
    } catch(e) { console.error('Migration error:', e); }
  }

  await load();
  render();
})();

// Auto-refresh when tab becomes active (picks up other users' changes)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    await load();
    render();
  }
});
</script>
